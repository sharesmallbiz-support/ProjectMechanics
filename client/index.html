    <link
      rel="apple-touch-icon"

      href="./apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"

      type="image/png"

    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>
      Project Mechanics - Project Management Methodology & Resources
    </title>
    <meta
      name="description"
      content="Comprehensive project management methodology covering project lifecycle, portfolio management, change management, conflict resolution, and leadership principles."

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://sharesmallbiz-support.github.io/ProjectMechanics/"
    />
    <meta
      property="og:title"
      content="Project Mechanics - Project Management Methodology"
    />
    <meta
      property="og:description"
      content="Comprehensive project management methodology covering project lifecycle, portfolio management, change management, and leadership principles."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Project Mechanics - Project Management Methodology"
    />
    <meta
      name="twitter:description"
      content="Comprehensive project management methodology covering project lifecycle, portfolio management, change management, and leadership principles."
    />

    <!-- Optimized font loading - only Inter (used in design) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Project Mechanics",
        "url": "https://sharesmallbiz-support.github.io/ProjectMechanics/",
        "description": "Comprehensive project management methodology covering project lifecycle, portfolio management, change management, conflict resolution, and leadership principles",
        "publisher": {
          "@type": "Organization",
          "name": "Project Mechanics"
        },
        "inLanguage": "en-US",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://sharesmallbiz-support.github.io/ProjectMechanics/#/methodology?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
