version: '3.8'

services:
  api:
    build: .
    container_name: document-agent-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Document Agent API
      - APP_VERSION=1.0.0
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      # Load from .env file - make sure to create .env from .env.example
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL:-gpt-4}
    volumes:
      # Mount prompts directory for easy updates
      - ./data/prompts:/app/data/prompts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
